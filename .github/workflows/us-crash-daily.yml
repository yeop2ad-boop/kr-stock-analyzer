name: 미국 52주 최대 하락폭(급락률) 매일 갱신

on:
  schedule:
    # 평일 22:50 UTC = 미국 장 마감 후(한국시간 다음날 오전 7시 50분)
    - cron: "50 22 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: us-crash
  cancel-in-progress: false

jobs:
  crash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 미국 종목 52주 최대 하락폭 계산
        run: python3 scripts/fill-risk-gaps.py us-crash

      - name: 변경사항 커밋 및 푸시
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/us-workforce.json
          if git diff --cached --quiet; then
            echo "변경된 데이터 없음"
          else
            git commit -m "미국 52주 최대 하락폭 자동 갱신 ($(date -u +%Y-%m-%d))"
            git pull --rebase -X theirs origin main
            git push
          fi
