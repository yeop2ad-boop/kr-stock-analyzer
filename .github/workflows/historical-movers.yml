name: 과거분석(한달/1년 상승·하락) 자동 갱신

# 2026-11-20: 예약 실행을 껐다(수동 실행만 남김). 이 배치가 만드는 data/historical-movers.json 을 읽는 화면
# ('한달/1년 상승·하락' 버튼, index.html #historicalInlineWrap)이 늘 숨김 상태라 앱이 더는 이 파일을 읽지 않는다.
# 화면을 되살리면 아래 schedule 을 다시 넣을 것(예전: 매일 22:40 UTC = KST 오전 7시 40분, cron "40 22 * * *").
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: 과거분석 TOP50 갱신
        run: node scripts/scan-historical-movers.js

      - name: 변경사항 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/historical-movers.json
          if git diff --cached --quiet; then
            echo "변경된 데이터 없음"
          else
            git commit -m "과거분석: 한달/1년 상승·하락 자동 갱신 ($(date -u +%Y-%m-%d))"
            git pull --rebase -X theirs origin main
            git push
          fi
