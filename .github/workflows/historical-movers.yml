name: 과거분석(한달/1년 상승·하락) 자동 갱신

on:
  schedule:
    # 매일 22:40 UTC = 한국시간(KST) 오전 7시 40분(신기술·브랜드평판 갱신 직후)
    - cron: "40 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: 과거분석 TOP50 갱신
        run: node scripts/scan-historical-movers.js

      - name: 변경사항 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/historical-movers.json
          if git diff --cached --quiet; then
            echo "변경된 데이터 없음"
          else
            git commit -m "과거분석: 한달/1년 상승·하락 자동 갱신 ($(date -u +%Y-%m-%d))"
            git push
          fi
