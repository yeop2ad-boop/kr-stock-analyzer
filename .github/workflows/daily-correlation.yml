name: 상관관계도 자동 갱신(매일 오전 7시 KST)

on:
  schedule:
    # 22:00 UTC = 한국시간(KST) 오전 7시 — 인사이트 > 상관관계도 표가 이 시각에 갱신되고 하루 동안 고정됨
    - cron: "0 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: 17개 랭킹 상관관계(과거 상·하위 100 → 상승·하락 그룹 적중) 계산
        shell: pwsh
        working-directory: sector-map
        run: ./scripts/scan-correlation-daily.ps1

      - name: 변경사항 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/correlation-daily.json
          if git diff --cached --quiet; then
            echo "변경된 데이터 없음"
          else
            git commit -m "상관관계도 자동 갱신 ($(date -u -d '+9 hours' +%Y-%m-%d) KST)"
            git pull --rebase origin main
            git push
          fi
