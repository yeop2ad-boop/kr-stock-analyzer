name: 미국 아침 배치(스냅샷, 오전 6시 23분 KST)

on:
  schedule:
    # 21:23 UTC = 한국시간(KST) 오전 6시 23분 — 미국장 마감(겨울 21:00 UTC·여름 20:00 UTC) 직후.
    # 2026-11-20: 22:00(오전 7시) → 21:23. GitHub 예약 실행이 몇 시간씩 밀려 정각을 피하고 앞당겼다.
    #   섹터맵 전체 배치(21:47)와 sp500-sectors.json·해외 지도 파일을 같이 쓰므로 24분 띄움(이 배치가 먼저 끝남).
    # 순서: 미국 재무 스냅샷(시총/PER/배당률 → 분기TTM 증가율 → 영업이익률/ROE/부채비율) → 해외 지도 파일 재생성
    - cron: "23 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - name: 미국 스냅샷 1) 시가총액/PER/배당률/등락률
        shell: pwsh
        working-directory: sector-map
        run: ./scripts/fetch-sp500-data.ps1

      - name: 미국 스냅샷 2) 매출/순이익/현금흐름 증가율(분기 TTM)
        shell: pwsh
        working-directory: sector-map
        run: ./scripts/fetch-growth-metrics.ps1

      - name: 미국 스냅샷 3) 영업이익률/ROE/부채비율/52주위치
        shell: pwsh
        working-directory: sector-map
        run: ./scripts/fetch-financial-ratios.ps1 -Market us

      # 2026-11-20: 이 배치가 갱신한 미국 쪽만 다시 만든다(국내 지도 파일은 건드리지 않음 — 다른 배치와 같은 파일을 덜 겹치게)
      - name: 지도 core/extra 데이터 재생성(해외)
        shell: pwsh
        working-directory: sector-map
        run: ./scripts/regenerate-core-extra.ps1 -Market us

      # 2026-11-20: 예전에는 pull --rebase 만 해서, 섹터맵 전체 배치가 같은 파일을 먼저 올리면 내용 충돌로 실패했다(11/20 커밋 없음).
      # 커밋·rebase(-X theirs)·push 재시도는 공용 스크립트로.
      - name: 변경사항 커밋 및 푸시
        run: |
          bash scripts/ci-commit-push.sh "미국 아침 배치: 스냅샷 갱신 ($(date -u -d '+9 hours' +%Y-%m-%d) KST)" \
            sector-map/data/sp500-sectors.json sector-map/data/sp500-data-core.js sector-map/data/sp500-data-extra.js
