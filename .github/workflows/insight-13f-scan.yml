name: 인사이트 13F 공시 스캔

on:
  schedule:
    # 매일 13:00 UTC(오전 9시 ET 전후) — SEC EDGAR가 그날 접수된 공시를 처리한 뒤 확인
    - cron: "0 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: 13F 공시 스캔 및 갱신
        run: node scripts/scan-13f.js

      - name: 변경사항 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "변경된 데이터 없음"
          else
            git commit -m "인사이트: 13F 공시 자동 갱신 ($(date -u +%Y-%m-%d))"
            git push
          fi
