name: S&P 500 섹터맵 데이터 자동 갱신

on:
  schedule:
    # 매일 22:00 UTC = 한국시간(KST) 오전 7시
    - cron: "0 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 시가총액/섹터/PER/EPS/배당률/등락률 갱신
        shell: pwsh
        working-directory: sector-map
        run: ./scripts/fetch-sp500-data.ps1

      - name: 매출액/현금흐름/순이익 증가율 갱신
        shell: pwsh
        working-directory: sector-map
        run: ./scripts/fetch-growth-metrics.ps1

      - name: data.js 재생성
        shell: pwsh
        working-directory: sector-map
        run: |
          $json = Get-Content data/sp500-sectors.json -Raw
          "const SP500_DATA = $json;" | Set-Content data/sp500-data.js -Encoding utf8

      - name: 변경사항 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sector-map/data/sp500-sectors.json sector-map/data/sp500-data.js
          if git diff --cached --quiet; then
            echo "변경된 데이터 없음"
          else
            git commit -m "S&P500 섹터맵 데이터 자동 갱신 ($(date -u +%Y-%m-%d))"
            git push
          fi
