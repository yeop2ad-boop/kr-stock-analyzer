name: 한국 저녁 배치(스냅샷, 오후 4시 17분 KST)

on:
  schedule:
    # 07:17 UTC = 한국시간(KST) 오후 4시 17분 — 한국장 마감(15:30) 이후(야후 시세 지연 20분을 감안해 마감 47분 뒤).
    # 2026-11-20: 08:00(오후 5시) → 07:17. GitHub 예약 실행이 몇 시간씩 밀려 정각을 피하고 앞당겼다.
    #   섹터맵 전체 배치(07:47)와 kr-sectors.json·국내 지도 파일을 같이 쓰므로 30분 띄움.
    # 순서: 한국 재무 스냅샷(가격/시총/PER/배당률/분기TTM 증가율 → 영업이익률/ROE/부채비율) → 국내 지도 파일 재생성
    - cron: "17 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - name: 한국 스냅샷 1) 코스피200/코스닥150 (가격/시총/PER/배당률/분기 TTM 증가율)
        shell: pwsh
        working-directory: sector-map
        run: ./scripts/fetch-kr-data.ps1

      - name: 한국 스냅샷 2) 영업이익률/ROE/부채비율/52주위치
        shell: pwsh
        working-directory: sector-map
        run: ./scripts/fetch-financial-ratios.ps1 -Market kr

      # 2026-11-20: 이 배치가 갱신한 한국 쪽만 다시 만든다(미국 지도 파일은 건드리지 않음 — 다른 배치와 같은 파일을 덜 겹치게)
      - name: 지도 core/extra 데이터 재생성(국내)
        shell: pwsh
        working-directory: sector-map
        run: ./scripts/regenerate-core-extra.ps1 -Market kr

      # 2026-11-20: 커밋·rebase(-X theirs)·push 재시도는 공용 스크립트로(다른 배치와 겹쳐도 실패하지 않게)
      - name: 변경사항 커밋 및 푸시
        run: |
          bash scripts/ci-commit-push.sh "한국 저녁 배치: 스냅샷 갱신 ($(date -u -d '+9 hours' +%Y-%m-%d) KST)" \
            sector-map/data/kr-sectors.json sector-map/data/kr-data-core.js sector-map/data/kr-data-extra.js
