name: 신기술 인사이트 자동 생성

on:
  schedule:
    # 2026-10-14 사용자 요청으로 다시 켬(8/26에 Anthropic/OpenAI 비용 때문에 중지했었음).
    # 매일 21:07 UTC = 한국시간(KST) 오전 6시 7분 — GitHub 예약 실행이 보통 1~2시간 늦게 시작하므로 오전 7시 전후에 반영
    - cron: "7 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: 신기술 요약·이미지 생성
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/scan-techinsight.js

      - name: 변경사항 커밋 및 푸시
        run: |
          # 2026-11-20: 예전에는 받지 않고 바로 push 해서, 그 사이 다른 배치가 먼저 올리면 거절됐다.
          # 커밋·rebase(-X theirs)·push 재시도는 공용 스크립트로. 스테이징 대상은 예전과 같은 data/ 전체.
          bash scripts/ci-commit-push.sh "신기술: 자동 갱신 ($(date -u +%Y-%m-%d))" data
