name: 신기술 인사이트 자동 생성

on:
  # 2026-08-26: Anthropic/OpenAI API 종량제 비용 문제로 자동 스케줄 중지(사용자 요청).
  # 필요 시 Actions 탭에서 이 워크플로를 "Run workflow"로 수동 실행은 여전히 가능.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: 신기술 요약·이미지 생성
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/scan-techinsight.js

      - name: 변경사항 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "변경된 데이터 없음"
          else
            git commit -m "신기술: 자동 갱신 ($(date -u +%Y-%m-%d))"
            git push
          fi
