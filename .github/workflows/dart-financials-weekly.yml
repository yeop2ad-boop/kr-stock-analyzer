name: 다트공시 데이터 갱신

on:
  schedule:
    # 매주 월요일 21:00 UTC = 한국시간(KST) 월요일 오전 6시 — 재무·인사 데이터라 매일 바뀌지 않아 주 1회
    - cron: "0 21 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: 다트공시 4대 지표 수집
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: node scripts/scan-dart-financials.js

      - name: 변경사항 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/dart-financials.json data/dart-corpcode-map.json
          if git diff --cached --quiet; then
            echo "변경된 데이터 없음"
          else
            git commit -m "다트공시: 자동 갱신 ($(date -u +%Y-%m-%d))"
            git push
          fi
