name: 다트공시 데이터 갱신

on:
  schedule:
    # 매일 09:00 UTC = 한국시간(KST) 오후 6시 (지도 데이터 자동 갱신과 동일 시각)
    - cron: "0 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# 2026-10-08: 수동 실행이 겹치면 두 번째가 같은 데이터 파일 커밋에서 충돌해 실패 — 한 번에 하나씩
concurrency:
  group: dart-financials
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: 다트공시 4대 지표 수집
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: node scripts/scan-dart-financials.js

      # 2026-10-06: 리스크 탭 EPS·분기 매출/순이익·부채비율·급락률 — 새 보고서가 나온 항목은 다시 채우고 급락률은 매일 새로 계산
      - name: 리스크 항목(EPS·매출·순이익·부채·급락률) 보완
        continue-on-error: true
        run: python3 scripts/fill-risk-gaps.py kr

      # 2026-10-08: 실적발표 일정(미국 나스닥 캘린더 확정일 · 한국 DART 잠정실적/정기보고서 공시일) — 앱의 '실적' 마크·실적 캘린더용
      - name: 실적발표 일정 갱신
        continue-on-error: true
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python3 scripts/build-earnings-calendar.py

      - name: 변경사항 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/dart-financials.json data/dart-corpcode-map.json data/earnings-calendar.json
          [ -f data/earnings-debug.json ] && git add data/earnings-debug.json
          if git diff --cached --quiet; then
            echo "변경된 데이터 없음"
          else
            git commit -m "다트공시: 자동 갱신 ($(date -u +%Y-%m-%d))"
            git pull --rebase -X theirs origin main
            git push
          fi
