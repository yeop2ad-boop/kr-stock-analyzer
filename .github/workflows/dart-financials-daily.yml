name: 다트공시 데이터 갱신

on:
  schedule:
    # 2026-11-20: 정각을 피함(GitHub 예약 실행이 몇 시간씩 밀림). 공시는 장 마감 뒤에도 나오므로 시각은 거의 그대로 둔다.
    # 매일 08:53 UTC = 한국시간(KST) 오후 5시 53분(예전 09:00)
    - cron: "53 8 * * *"
    # 2026-10-22: 한국 실적 시즌엔 낮에 나온 잠정실적이 저녁 6시까지 안 보였다 → 낮에도 한 번 더. 02:53 UTC = KST 오전 11시 53분(예전 03:00)
    - cron: "53 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# 2026-10-08: 수동 실행이 겹치면 두 번째가 같은 데이터 파일 커밋에서 충돌해 실패 — 한 번에 하나씩
concurrency:
  group: dart-financials
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      # 2026-11-20: 리스크 탭이 없어져 앱은 data/dart-financials.json 에서 급락률(crash)만 읽는다(app.js renderCrashInto).
      # 그래서 예약 실행에서는 DART 4대 지표(직원 수·급여·자사주·증자) 수집을 돌리지 않는다.
      # 수동 실행(Run workflow)에서는 예전처럼 전부 돈다 — 지수 구성이 바뀌어 종목 명단을 다시 만들 때 수동으로 한 번 돌릴 것.
      - name: 다트공시 4대 지표 수집(수동 실행에서만)
        if: github.event_name == 'workflow_dispatch'
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: node scripts/scan-dart-financials.js

      # 급락률은 시세 기반이라 매번 새로 계산. 예약 실행 = 급락률만(kr-crash), 수동 실행 = EPS·분기 매출/순이익·부채비율 보완까지(kr)
      - name: 급락률 갱신(수동 실행에서는 리스크 항목 전체 보완)
        id: risk
        continue-on-error: true
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 scripts/fill-risk-gaps.py kr
          else
            python3 scripts/fill-risk-gaps.py kr-crash
          fi

      # 2026-10-08: 실적발표 일정(미국 나스닥 캘린더 확정일 · 한국 DART 잠정실적/정기보고서 공시일) — 앱의 '실적' 마크·실적 캘린더용
      - name: 실적발표 일정 갱신
        continue-on-error: true
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python3 scripts/build-earnings-calendar.py

      # 2026-11-20: 커밋·rebase(-X theirs)·push 재시도는 공용 스크립트로(다른 배치와 겹쳐도 실패하지 않게)
      - name: 변경사항 커밋 및 푸시
        run: |
          bash scripts/ci-commit-push.sh "다트공시: 자동 갱신 ($(date -u +%Y-%m-%d))" \
            data/dart-financials.json data/dart-corpcode-map.json data/earnings-calendar.json

      # 2026-10-14: 위 급락률 단계가 조용히 실패해도 데이터는 커밋하되, 실행 결과는 실패로 표시해 GitHub 알림이 오게 함.
      # 2026-11-20: 스크립트가 성공 여부를 돌려주지 않아 매번 이 단계에서 '실패'로 끝나던 것을 고침(fill-risk-gaps.py) — 이제 진짜 실패일 때만 뜬다.
      - name: 급락률 단계 실패 알림
        if: steps.risk.outcome == 'failure'
        run: |
          echo "급락률 갱신 단계가 실패했습니다(90% 미만 갱신). 위 로그를 확인하세요."
          exit 1
