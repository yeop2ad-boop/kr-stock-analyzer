name: 국내 기관·자산운용사 보유종목 갱신(DART 5%룰)

# 2026-09-11 사용자 보고("국민연금·삼성자산운용 운용자산 변동이 최신화가 안 된 것 같다") —
# 이 데이터만 자동 배치에 빠져 있어 2026-08-26 이후 멈춰 있었다. DART 전체 상장사 순회라 시간이 오래 걸려
# 매일이 아니라 주 1회(월요일)로 돌린다.
on:
  schedule:
    # 매주 월요일 10:00 UTC = 한국시간 오후 7시
    - cron: "0 10 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: windows-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5

      - name: DART 5%룰 공시 수집(전체 상장사 순회)
        shell: pwsh
        working-directory: sector-map/scripts
        run: ./fetch-dart-institutions.ps1 -ApiKey "${{ secrets.DART_API_KEY }}"

      - name: 기관별 보유종목 TOP30 산출
        shell: pwsh
        working-directory: sector-map/scripts
        run: ./build-kr-institutions-data.ps1 -ApiKey "${{ secrets.DART_API_KEY }}"

      - name: 변경사항 커밋 및 푸시
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/insight-kr-institutions.json
          if git diff --cached --quiet; then
            echo "변경된 데이터 없음"
          else
            git commit -m "국내 기관·자산운용사: 자동 갱신 ($(date -u +%Y-%m-%d))"
            git pull --rebase origin main
            git push
          fi
