name: 지도 대금 모드 기준선(시간대별 거래대금) 자동 갱신

on:
  schedule:
    # 평일 21:57 UTC = 한국시간 오전 6시 57분(한국 장 마감 후·미국 장 마감 후, 다음 한국 장 시작 전)
    # 2026-11-20: 22:30 → 21:57. GitHub 예약 실행이 몇 시간씩 밀려 앞당겼다(미국 마지막 1시간봉이 필요해 21:20 이전으로는 당기지 않음).
    - cron: "57 21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 시간대별 거래대금 기준선 계산
        run: python scripts/build-volume-profile.py

      - name: 변경사항 커밋 및 푸시
        run: |
          # 2026-11-20: 커밋·rebase(-X theirs)·push 재시도는 공용 스크립트로(다른 배치와 겹쳐도 실패하지 않게)
          bash scripts/ci-commit-push.sh "지도 대금 기준선 자동 갱신 ($(date -u +%Y-%m-%d))" data/volume-profile.json
