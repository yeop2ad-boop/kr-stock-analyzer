name: 지도 대금 모드 기준선(시간대별 거래대금) 자동 갱신

on:
  schedule:
    # 평일 22:30 UTC = 한국시간 오전 7시 30분(한국 장 마감 후·미국 장 마감 후, 다음 한국 장 시작 전)
    - cron: "30 22 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 시간대별 거래대금 기준선 계산
        run: python scripts/build-volume-profile.py

      - name: 변경사항 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/volume-profile.json
          if git diff --cached --quiet; then
            echo "변경된 데이터 없음"
          else
            git commit -m "지도 대금 기준선 자동 갱신 ($(date -u +%Y-%m-%d))"
            git pull --rebase
            git push
          fi
