name: 오늘의 증시지도 음성 생성

# 아침 브리핑 쇼츠("오늘의 증시지도") 대본을 음성으로 — 그림(brief-images.yml)과 같은 키(OPENAI_API_KEY) 사용.
# 주문(data/brief-voice/<날짜>/job.json)이 올라오면 돌고, 만든 mp3 를 같은 폴더에 넣어 다시 올린다. (2026-11-27)
on:
  push:
    branches: [main]
    paths:
      - "data/brief-voice/*/job.json"
  workflow_dispatch:
    inputs:
      day:
        description: "폴더 이름(YYYY-MM-DD…) — 비우면 가장 최근 주문"
        required: false

permissions:
  contents: write

concurrency:
  group: brief-voice
  cancel-in-progress: false

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: 음성 생성
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/gen-brief-voice.js ${{ inputs.day }}

      - name: 변경사항 커밋 및 푸시
        if: always()
        run: |
          bash scripts/ci-commit-push.sh "오늘의 증시지도 음성: 자동 생성 ($(date -u +%Y-%m-%d))" data/brief-voice
