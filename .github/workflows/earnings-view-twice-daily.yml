name: 실적 화면 DB 하루 두 번 갱신

on:
  schedule:
    # 10:30 UTC = 한국시간 오후 7시 30분(한국 장 마감·다트공시 갱신 이후), 22:30 UTC = 오전 7시 30분(미국 장 마감 이후)
    - cron: "30 10 * * *"
    - cron: "30 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: earnings-view
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: 헤드리스 크롬 준비
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: 앱을 띄우고 실적 DB 계산
        run: |
          python3 -m http.server 8090 >/dev/null 2>&1 &
          sleep 2
          node scripts/build-earnings-view.js

      - name: 변경사항 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/earnings-view.json
          if git diff --cached --quiet; then
            echo "변경된 데이터 없음"
          else
            git commit -m "실적 화면 DB 자동 갱신 ($(date -u +'%Y-%m-%d %H:%M'))"
            git pull --rebase -X theirs origin main
            git push
          fi
