name: 브랜드평판순 현재가 자동 갱신

on:
  schedule:
    # 매일 22:30 UTC = 한국시간(KST) 오전 7시 30분(신기술 갱신 직후)
    - cron: "30 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: 현재가·1년 변동 갱신
        run: node scripts/scan-brand-reputation-prices.js

      - name: 변경사항 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/brand-reputation-prices.json
          if git diff --cached --quiet; then
            echo "변경된 데이터 없음"
          else
            git commit -m "브랜드평판순: 현재가 자동 갱신 ($(date -u +%Y-%m-%d))"
            git push
          fi
