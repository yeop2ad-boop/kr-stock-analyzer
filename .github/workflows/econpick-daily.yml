name: 경제pick 일일 갱신

on:
  schedule:
    # 매일 22:00 UTC = 한국시간(KST) 익일 07:00
    - cron: "0 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 경제뉴스 수집 · AI요약 · AI이미지 생성
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/scan-econpick.js

      - name: 변경사항 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/econpick.json data/econpick-seen.json data/econpick-images/
          if git diff --cached --quiet; then
            echo "변경된 데이터 없음"
          else
            git commit -m "경제pick: 일일 자동 갱신 ($(date -u +%Y-%m-%d))"
            git push
          fi
