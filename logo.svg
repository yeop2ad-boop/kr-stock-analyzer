  <defs>
    <style>.wm{font-family:"Pretendard","Inter","Segoe UI","Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;}</style>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b2a4a"/><stop offset="1" stop-color="#0d1730"/></linearGradient>
  </defs>
  <g transform="translate(16,16) scale(0.25)">
    <rect width="512" height="512" rx="112" fill="url(#bg)"/>
    <rect x="92" y="300" width="64" height="120" rx="12" fill="#3e4c6e"/>
