<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<script>
  // 로그인 게이트: 로그인 기록(ntj_auth)이 없으면 루트 로그인 화면으로 보냄
  // (최종 판정은 페이지 하단의 Firebase 스크립트가 한 번 더 확인)
  try {
    if (!localStorage.getItem("ntj_auth")) location.replace("../index.html");
  } catch (e) {}
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>마켓맵. 섹터맵</title>
<link rel="icon" type="image/png" sizes="512x512" href="../logos/내투자_앱로고2_512.png" />
<link rel="icon" type="image/png" sizes="180x180" href="../logos/내투자_앱로고2_180.png" />
<link rel="apple-touch-icon" href="../logos/내투자_앱로고2_180.png" />
<link rel="manifest" href="../manifest.json" />
<meta name="theme-color" content="#1b2a4a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="마켓맵" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="mapLoadingSplash" class="loading-splash">
  <img src="../logos/내투자_앱로고2.png" alt="marketmap.kr" class="loading-splash-logo" />
  <p class="loading-splash-caption">100개 이상의 기업정보를 실시간 연결중...</p>
</div>

<div class="app-shell">

  <header class="top-bar">
    <div class="top-bar-row">
      <div class="toggle-pill" id="marketTogglePill">
        <button type="button" class="toggle-btn" data-market="domestic" data-i18n="market.kr">국내</button>
        <button type="button" class="toggle-btn active" data-market="overseas" data-i18n="market.us">해외</button>
      </div>

      <div class="top-bar-icons">
        <button type="button" class="icon-btn" id="mapSearchBtn" aria-label="검색">
          <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><line x1="21" y1="21" x2="16.65" y2="16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>

    <div class="filter-bar">
      <button type="button" class="filter-icon-btn" id="allFiltersBtn" aria-label="전체 설정">
        <svg viewBox="0 0 24 24" fill="none"><line x1="4" y1="6" x2="20" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="9" cy="6" r="2" fill="currentColor"/><line x1="4" y1="12" x2="20" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="12" r="2" fill="currentColor"/><line x1="4" y1="18" x2="20" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="11" cy="18" r="2" fill="currentColor"/></svg>
      </button>
      <button type="button" class="filter-icon-btn" id="resetViewBtn" aria-label="전체 초기화">
        <svg viewBox="0 0 24 24" fill="none"><path d="M20 12a8 8 0 1 1-2.34-5.66" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polyline points="20 4 20 9 15 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button type="button" class="filter-chip metric-chip" data-metric="week52RangePct">
        52주최저<span class="chip-reset" data-metric="week52RangePct" role="button" aria-label="52주최저 필터 초기화"><svg viewBox="0 0 24 24" width="12" height="12" fill="none"><line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><line x1="18" y1="6" x2="6" y2="18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></span><svg class="chip-chevron" viewBox="0 0 24 24" width="13" height="13" fill="none"><path d="M5 9l7 7 7-7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button type="button" class="filter-chip metric-chip" data-metric="popularStocks">
        거래대금<span class="chip-reset" data-metric="popularStocks" role="button" aria-label="거래대금 필터 초기화"><svg viewBox="0 0 24 24" width="12" height="12" fill="none"><line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><line x1="18" y1="6" x2="6" y2="18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></span><svg class="chip-chevron" viewBox="0 0 24 24" width="13" height="13" fill="none"><path d="M5 9l7 7 7-7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button type="button" class="filter-chip metric-chip" data-metric="pressureScore">
        상승압력<span class="chip-reset" data-metric="pressureScore" role="button" aria-label="상승압력 필터 초기화"><svg viewBox="0 0 24 24" width="12" height="12" fill="none"><line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><line x1="18" y1="6" x2="6" y2="18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></span><svg class="chip-chevron" viewBox="0 0 24 24" width="13" height="13" fill="none"><path d="M5 9l7 7 7-7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button type="button" class="filter-chip metric-chip" data-metric="stabilityScore">
        투자안정<span class="chip-reset" data-metric="stabilityScore" role="button" aria-label="투자안정 필터 초기화"><svg viewBox="0 0 24 24" width="12" height="12" fill="none"><line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><line x1="18" y1="6" x2="6" y2="18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></span><svg class="chip-chevron" viewBox="0 0 24 24" width="13" height="13" fill="none"><path d="M5 9l7 7 7-7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button type="button" class="filter-chip metric-chip" data-metric="changePct">
        등락률<span class="chip-reset" data-metric="changePct" role="button" aria-label="등락률 필터 초기화"><svg viewBox="0 0 24 24" width="12" height="12" fill="none"><line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><line x1="18" y1="6" x2="6" y2="18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></span><svg class="chip-chevron" viewBox="0 0 24 24" width="13" height="13" fill="none"><path d="M5 9l7 7 7-7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button type="button" class="filter-chip metric-chip" data-metric="revenueGrowth">
        매출성장<span class="chip-reset" data-metric="revenueGrowth" role="button" aria-label="매출성장 필터 초기화"><svg viewBox="0 0 24 24" width="12" height="12" fill="none"><line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><line x1="18" y1="6" x2="6" y2="18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></span><svg class="chip-chevron" viewBox="0 0 24 24" width="13" height="13" fill="none"><path d="M5 9l7 7 7-7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button type="button" class="filter-chip metric-chip" data-metric="netIncomeGrowth">
        순이익증가<span class="chip-reset" data-metric="netIncomeGrowth" role="button" aria-label="순이익증가 필터 초기화"><svg viewBox="0 0 24 24" width="12" height="12" fill="none"><line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><line x1="18" y1="6" x2="6" y2="18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></span><svg class="chip-chevron" viewBox="0 0 24 24" width="13" height="13" fill="none"><path d="M5 9l7 7 7-7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button type="button" class="filter-chip metric-chip" data-metric="dividendYield">
        배당률<span class="chip-reset" data-metric="dividendYield" role="button" aria-label="배당률 필터 초기화"><svg viewBox="0 0 24 24" width="12" height="12" fill="none"><line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><line x1="18" y1="6" x2="6" y2="18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></span><svg class="chip-chevron" viewBox="0 0 24 24" width="13" height="13" fill="none"><path d="M5 9l7 7 7-7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button type="button" class="filter-chip metric-chip" data-metric="debtRatio">
        부채비율<span class="chip-reset" data-metric="debtRatio" role="button" aria-label="부채비율 필터 초기화"><svg viewBox="0 0 24 24" width="12" height="12" fill="none"><line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><line x1="18" y1="6" x2="6" y2="18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></span><svg class="chip-chevron" viewBox="0 0 24 24" width="13" height="13" fill="none"><path d="M5 9l7 7 7-7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button type="button" class="filter-chip metric-chip" data-metric="cashFlowGrowth">
        현금흐름<span class="chip-reset" data-metric="cashFlowGrowth" role="button" aria-label="현금흐름 필터 초기화"><svg viewBox="0 0 24 24" width="12" height="12" fill="none"><line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><line x1="18" y1="6" x2="6" y2="18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></span><svg class="chip-chevron" viewBox="0 0 24 24" width="13" height="13" fill="none"><path d="M5 9l7 7 7-7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button type="button" class="filter-chip metric-chip" data-metric="per">
        PER<span class="chip-reset" data-metric="per" role="button" aria-label="PER 필터 초기화"><svg viewBox="0 0 24 24" width="12" height="12" fill="none"><line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><line x1="18" y1="6" x2="6" y2="18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></span><svg class="chip-chevron" viewBox="0 0 24 24" width="13" height="13" fill="none"><path d="M5 9l7 7 7-7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <div class="ticker-tape" id="tickerTape" style="display:none;">
    <div class="ticker-tape-track" id="tickerTapeTrack"></div>
  </div>

  <main class="map-viewport" id="mapViewport">
    <div class="map-world" id="mapWorld"></div>

    <div class="map-side-buttons">
      <button type="button" class="side-btn" id="sizeModeBtn">시총</button>
      <button type="button" class="side-btn" id="logoModeBtn">로고</button>
      <button type="button" class="side-btn" id="watchFilterBtn">관심</button>
      <button type="button" class="side-btn" id="changeModeBtn">등락</button>
    </div>

    <div class="ai-fab-row">
      <div class="ai-fab" id="aiFabTime"></div>
      <button type="button" class="universe-toggle-btn" id="universeToggleBtn"></button>
    </div>

    <button type="button" class="locate-fab" id="fitAllBtn" aria-label="전체보기">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" fill="currentColor"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>

    <div class="bottom-left-controls">
      <div class="change-legend">
        <span class="change-legend-label">-3%</span>
        <span class="change-legend-bar"></span>
        <span class="change-legend-label">+3%</span>
      </div>
    </div>

    <div class="loading-indicator" id="loadingIndicator">
      <div class="loading-spinner"></div>
      섹터맵 불러오는 중...
    </div>

    <div class="all-filters-backdrop" id="allFiltersBackdrop"></div>
    <div class="all-filters-sheet" id="allFiltersSheet">
      <div class="range-sheet-handle"></div>
      <div class="all-filters-header">
        <span>전체 설정</span>
        <button type="button" id="allFiltersCloseBtn" aria-label="닫기">&times;</button>
      </div>
      <div class="all-filters-body" id="allFiltersBody"></div>
    </div>
  </main>

  <!-- app-shell 직계 자식으로 배치 — bottom:0 기준을 map-viewport가 아니라 화면 진짜 바닥(app-shell)으로 잡아 하단 네비를 덮으며 올라오게 함 -->
  <div class="company-sheet" id="companySheet">
    <div class="company-sheet-handle"></div>
    <div class="company-sheet-body" id="companySheetBody"></div>
  </div>

  <div class="range-sheet" id="rangeSheet">
    <div class="range-sheet-handle"></div>
    <div class="range-sheet-header">
      <span id="rangeSheetTitle">시가총액</span>
      <button type="button" id="rangeSheetResetBtn">전체</button>
    </div>
    <div class="range-sheet-value" id="rangeSheetValue">전체</div>
    <div class="range-slider" id="rangeSlider">
      <div class="range-slider-track"></div>
      <div class="range-slider-fill" id="rangeSliderFill"></div>
      <div class="range-slider-thumb" id="rangeThumbMin" tabindex="0"></div>
      <div class="range-slider-thumb" id="rangeThumbMax" tabindex="0"></div>
    </div>
    <div class="range-slider-labels" id="rangeSliderLabels"></div>
    <div class="range-sheet-note" id="rangeSheetNote">데이터 준비중입니다</div>
  </div>

  <nav class="bottom-nav">
    <button type="button" class="bottom-nav-btn active" data-toast="지도">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 21s7-6.1 7-11.5A7 7 0 0 0 5 9.5C5 14.9 12 21 12 21Z" fill="currentColor"/><circle cx="12" cy="9.5" r="2.6" fill="#fff"/></svg>
      <span data-i18n="nav.map">지도</span>
    </button>
    <button type="button" class="bottom-nav-btn" id="bottomNavStudyBtn" aria-label="홈">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 3.2c.4 0 .77.15 1.05.42l7 6.7c.3.28.45.66.45 1.05v7.13c0 1.1-.9 2-2 2h-3.5a1 1 0 0 1-1-1v-4.5a1 1 0 0 0-1-1h-2a1 1 0 0 0-1 1v4.5a1 1 0 0 1-1 1H5.5c-1.1 0-2-.9-2-2v-7.13c0-.39.16-.77.45-1.05l7-6.7c.28-.27.65-.42 1.05-.42Z" fill="currentColor"/></svg>
      <span data-i18n="nav.home">홈</span>
    </button>
    <button type="button" class="bottom-nav-btn" id="bottomNavCalendarBtn2" aria-label="캘린더">
      <svg viewBox="0 0 24 24" fill="none">
        <rect x="3.3" y="5.5" width="17.4" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/>
        <line x1="3.3" y1="10" x2="20.7" y2="10" stroke="currentColor" stroke-width="1.7"/>
        <rect x="7.2" y="2.3" width="2" height="5.6" rx="1" fill="currentColor"/>
        <rect x="14.8" y="2.3" width="2" height="5.6" rx="1" fill="currentColor"/>
      </svg>
      <span data-i18n="nav.calendar">캘린더</span>
    </button>
    <button type="button" class="bottom-nav-btn" id="bottomNavMarketBtn2" aria-label="시장">
      <svg viewBox="0 0 24 24" fill="none"><polyline points="3 17 9 11 13 15 21 5" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="15 5 21 5 21 11" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span data-i18n="nav.marketBtn">시장</span>
    </button>
    <button type="button" class="bottom-nav-btn" id="bottomNavMoreBtn2" aria-label="더보기">
      <svg viewBox="0 0 24 24" fill="none"><rect x="4" y="6" width="16" height="3" rx="1.5" fill="currentColor"/><rect x="4" y="10.5" width="16" height="3" rx="1.5" fill="currentColor"/><rect x="4" y="15" width="16" height="3" rx="1.5" fill="currentColor"/></svg>
      <span data-i18n="nav.more">더보기</span>
    </button>
  </nav>

  <div class="toast" id="toast"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="data/sp500-data-core.js"></script>
<script src="data/kr-data-core.js" onerror="window.KR_CORE_DATA = { companies: [] };"></script>
<script src="app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="../firebase-config.js"></script>
<script>
  // 로그인 상태 최종 확인 — 로그아웃 상태로 판정되면 루트 로그인 화면으로 보냄
  if (typeof firebase !== "undefined") {
    firebase.auth().onAuthStateChanged(function (user) {
      try {
        if (user) localStorage.setItem("ntj_auth", "1");
        else localStorage.removeItem("ntj_auth");
      } catch (e) {}
      if (!user) location.replace("../index.html");
    });
  }
</script>
</body>
</html>
