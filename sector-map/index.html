<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>내투자. 섹터맵</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app-shell">

  <header class="top-bar">
    <div class="top-bar-row">
      <button type="button" class="brand-logo" id="brandLogoBtn">내투자<span class="brand-dot">.</span></button>

      <div class="toggle-pill" id="marketTogglePill">
        <button type="button" class="toggle-btn" data-market="domestic">국내</button>
        <button type="button" class="toggle-btn active" data-market="overseas">해외</button>
      </div>

      <div class="top-bar-icons">
        <button type="button" class="icon-btn" data-toast="검색 (준비중)" aria-label="검색">
          <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><line x1="21" y1="21" x2="16.65" y2="16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button type="button" class="icon-btn" data-toast="채팅 (준비중)" aria-label="채팅">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 12a8 8 0 1 1 3.2 6.4L4 20l1.2-3.6A7.96 7.96 0 0 1 4 12Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        </button>
        <button type="button" class="icon-btn" data-toast="알림 (준비중)" aria-label="알림">
          <svg viewBox="0 0 24 24" fill="none"><path d="M6 9a6 6 0 1 1 12 0c0 4 1.5 5.5 1.5 5.5H4.5S6 13 6 9Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9.5 17a2.5 2.5 0 0 0 5 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span class="icon-badge-dot"></span>
        </button>
        <button type="button" class="icon-btn" data-toast="메뉴 (준비중)" aria-label="메뉴">
          <svg viewBox="0 0 24 24" fill="none"><line x1="4" y1="7" x2="20" y2="7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="4" y1="12" x2="20" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="4" y1="17" x2="20" y2="17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>

    <div class="filter-bar">
      <button type="button" class="filter-icon-btn" data-toast="필터 설정 (준비중)" aria-label="필터">
        <svg viewBox="0 0 24 24" fill="none"><line x1="4" y1="6" x2="20" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="9" cy="6" r="2" fill="currentColor"/><line x1="4" y1="12" x2="20" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="12" r="2" fill="currentColor"/><line x1="4" y1="18" x2="20" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="11" cy="18" r="2" fill="currentColor"/></svg>
      </button>
      <button type="button" class="filter-icon-btn" id="resetViewBtn" aria-label="새로고침">
        <svg viewBox="0 0 24 24" fill="none"><path d="M20 12a8 8 0 1 1-2.34-5.66" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polyline points="20 4 20 9 15 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button type="button" class="filter-chip metric-chip" data-metric="revenueGrowth">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none"><path d="M4 16l5-5 4 4 7-8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        매출액 증가
      </button>
      <button type="button" class="filter-chip metric-chip" data-metric="cashFlowGrowth">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none"><rect x="3" y="6" width="18" height="12" rx="2" stroke="currentColor" stroke-width="2.2"/><line x1="3" y1="10" x2="21" y2="10" stroke="currentColor" stroke-width="2.2"/></svg>
        현금흐름 증가
      </button>
      <button type="button" class="filter-chip metric-chip" data-metric="netIncomeGrowth">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2.2"/><path d="M12 7v10M9 9.5c0-1.4 1.3-2.5 3-2.5s3 1 3 2.2c0 3-6 1.8-6 4.8 0 1.3 1.3 2.5 3 2.5s3-1.1 3-2.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        순이익 증가
      </button>
      <button type="button" class="filter-chip metric-chip" data-metric="eps">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none"><rect x="4" y="4" width="16" height="16" rx="2" stroke="currentColor" stroke-width="2.2"/><line x1="4" y1="10" x2="20" y2="10" stroke="currentColor" stroke-width="2"/><line x1="10" y1="10" x2="10" y2="20" stroke="currentColor" stroke-width="2"/></svg>
        EPS
      </button>
      <button type="button" class="filter-chip metric-chip" data-metric="per">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none"><path d="M6 4v16M18 4v16M6 12h12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="6" cy="4" r="1.6" fill="currentColor"/><circle cx="18" cy="4" r="1.6" fill="currentColor"/></svg>
        PER
      </button>
      <button type="button" class="filter-chip metric-chip" data-metric="marketCap">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none"><path d="M4 21V9l8-5 8 5v12" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><line x1="4" y1="21" x2="20" y2="21" stroke="currentColor" stroke-width="2.2"/></svg>
        시가총액
      </button>
      <button type="button" class="filter-chip metric-chip" data-metric="popularStocks">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none"><path d="M7 11V21H4V11h3Zm4-7h2.5a2 2 0 0 1 1.9 2.7L14 10h4a2 2 0 0 1 1.9 2.7l-2 6A2 2 0 0 1 16 20H9V10l2-6Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        인기종목
      </button>
      <button type="button" class="filter-chip metric-chip" data-metric="riseRate">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none"><path d="M4 17l6-6 4 4 6-8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 7h6v6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        상승률
      </button>
      <button type="button" class="filter-chip metric-chip" data-metric="fallRate">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none"><path d="M4 7l6 6 4-4 6 8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 17h6v-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        하락률
      </button>
      <button type="button" class="filter-chip metric-chip" data-metric="dividendYield">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2.2"/><line x1="8" y1="16" x2="16" y2="8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="9" cy="9" r="1.4" fill="currentColor"/><circle cx="15" cy="15" r="1.4" fill="currentColor"/></svg>
        배당률
      </button>
    </div>
  </header>

  <main class="map-viewport" id="mapViewport">
    <div class="map-world" id="mapWorld"></div>

    <div class="map-side-buttons">
      <button type="button" class="side-btn active" data-toast="지도 보기">지도</button>
      <button type="button" class="side-btn" data-toast="주변 (준비중)">주변</button>
      <button type="button" class="side-btn" data-toast="거리 (준비중)">거리</button>
      <button type="button" class="side-btn" data-toast="정책 (준비중)">정책<span class="side-btn-dot"></span></button>
      <button type="button" class="side-btn" data-toast="분석 (준비중)">분석</button>
    </div>

    <button type="button" class="ai-fab" data-toast="AI 분석 (준비중)">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12 2l1.8 5.2L19 9l-5.2 1.8L12 16l-1.8-5.2L5 9l5.2-1.8L12 2z"/></svg>
      AI
    </button>

    <button type="button" class="locate-fab" id="fitAllBtn" aria-label="전체보기">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" fill="currentColor"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>

    <div class="bottom-left-controls">
      <button type="button" class="color-only-mini" id="colorOnlyToggle" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="11" height="11"><circle cx="12" cy="12" r="8" fill="currentColor"/></svg>
        색상만
      </button>
      <div class="change-legend">
        <span class="change-legend-label">-3%</span>
        <span class="change-legend-bar"></span>
        <span class="change-legend-label">+3%</span>
      </div>
    </div>

    <div class="loading-indicator" id="loadingIndicator">
      <div class="loading-spinner"></div>
      섹터맵 불러오는 중...
    </div>

    <div class="company-sheet" id="companySheet">
      <div class="company-sheet-handle"></div>
      <div class="company-sheet-body" id="companySheetBody"></div>
    </div>

    <div class="range-sheet" id="rangeSheet">
      <div class="range-sheet-handle"></div>
      <div class="range-sheet-header">
        <span id="rangeSheetTitle">시가총액</span>
        <button type="button" id="rangeSheetResetBtn">전체</button>
      </div>
      <div class="range-slider" id="rangeSlider">
        <div class="range-slider-track"></div>
        <div class="range-slider-fill" id="rangeSliderFill"></div>
        <div class="range-slider-thumb" id="rangeThumbMin" tabindex="0"></div>
        <div class="range-slider-thumb" id="rangeThumbMax" tabindex="0"></div>
      </div>
      <div class="range-slider-labels" id="rangeSliderLabels"></div>
      <div class="range-sheet-note" id="rangeSheetNote">데이터 준비중입니다</div>
    </div>
  </main>

  <nav class="bottom-nav">
    <button type="button" class="bottom-nav-btn active" data-toast="지도">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 21s7-6.1 7-11.5A7 7 0 0 0 5 9.5C5 14.9 12 21 12 21Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="9.5" r="2.3" stroke="currentColor" stroke-width="2"/></svg>
      지도
    </button>
    <button type="button" class="bottom-nav-btn" data-toast="내집얼마 (준비중)">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><text x="12" y="16.5" font-size="11" text-anchor="middle" fill="currentColor" font-weight="700">W</text></svg>
      내집얼마
    </button>
    <button type="button" class="bottom-nav-btn" data-toast="이야기 (준비중)">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 12a8 8 0 1 1 3.2 6.4L4 20l1.2-3.6A7.96 7.96 0 0 1 4 12Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      이야기
    </button>
    <button type="button" class="bottom-nav-btn" data-toast="분양 (준비중)">
      <svg viewBox="0 0 24 24" fill="none"><rect x="4" y="5" width="16" height="16" rx="2" stroke="currentColor" stroke-width="2"/><line x1="4" y1="10" x2="20" y2="10" stroke="currentColor" stroke-width="2"/><line x1="8" y1="3" x2="8" y2="7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="16" y1="3" x2="16" y2="7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      분양
    </button>
    <button type="button" class="bottom-nav-btn" data-toast="우리집 (준비중)">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 11l8-7 8 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10v9h12v-9" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      우리집
    </button>
  </nav>

  <div class="toast" id="toast"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="data/sp500-data.js"></script>
<script src="data/kr-data.js" onerror="window.KR_SECTOR_DATA = { companies: [] };"></script>
<script src="app.js"></script>
</body>
</html>
