# 참고용 설정 파일 — 지금까지는 Cloudflare 대시보드(Workers 편집기)에 worker.js를 직접 붙여넣어 배포해온 것으로 보여,
# 이 파일 없이도 대시보드에서 그대로 배포할 수 있습니다. 나중에 로컬에 Node.js + wrangler CLI를 설치해
# `wrangler deploy`로 배포하고 싶을 때를 위해 남겨둔 참고용 설정입니다.
#
# 대시보드에서 배포하는 경우 이 파일은 무시해도 되고, 대신 아래 값만 추가하면 됩니다(새 KV는 필요 없음 — 기존 CHAT_KV 재사용):
#   - Settings > Triggers > Cron Triggers  →  0 17 * * *  (매일 UTC 17:00 = 한국시간 새벽 2시)
#   - (기존) Settings > Bindings > KV Namespace → 변수 이름 CHAT_KV, 기존 채팅용 KV 그대로 유지 — 새로 손댈 것 없음

name = "us-stock-analyzer-worker"
main = "worker.js"
compatibility_date = "2024-01-01"

[triggers]
crons = ["0 17 * * *"]

# 아래 id 값은 실제 Cloudflare 대시보드의 기존 CHAT_KV 네임스페이스 ID로 바꿔주세요(새 네임스페이스를 만들 필요는 없습니다).
kv_namespaces = [
  { binding = "CHAT_KV", id = "여기에-기존-CHAT_KV-네임스페이스-ID" },
]
