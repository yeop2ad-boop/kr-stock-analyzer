<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>스톡챗 — 종목을 물어보면 AI가 분석해요</title>
<meta name="description" content="종목명만 말하면 시세·재무·승률 데이터를 바탕으로 정리해주는 AI 증권 분석 채팅" />
<meta name="theme-color" content="#d97757" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon.svg" />
<link rel="stylesheet" href="style.css?v=4" />
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><img src="icon.svg" alt="" width="28" height="28" /><span>스톡챗</span><em>베타</em></div>
    <div class="top-actions">
      <a class="top-link" href="https://marketmap.kr" target="_blank" rel="noopener">마켓맵 ↗</a>
      <button type="button" id="newChatBtn" class="top-btn">새 대화</button>
    </div>
  </header>

  <main id="list" class="list" aria-live="polite"></main>

  <footer class="foot">
    <form id="form" class="form">
      <textarea id="input" rows="1" maxlength="300" placeholder="종목이나 궁금한 점을 물어보세요 (AI)" enterkeyhint="send"></textarea>
      <button type="submit" id="send" aria-label="보내기">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </form>
    <div class="notice">AI 답변은 참고용 정보이며 투자 권유가 아닙니다. 최종 판단과 책임은 이용자에게 있습니다.<b id="remain"></b></div>
  </footer>
</div>
<script src="cards.js?v=2"></script>
<script src="data.js?v=1"></script>
<script src="flow.js?v=2"></script>
<script src="app.js?v=4"></script>
</body>
</html>
